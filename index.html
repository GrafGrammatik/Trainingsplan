<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1317">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}</style>
<title>Trainingsplaner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column gym log. Top switch Training/Verlauf, day header with set progress,
   list or one-set focus view, history with charts, and a rest-timer bar pinned to the bottom. */
:root{
  --bg:#E8EBEE; --card:#FFFFFF; --ink:#12161B; --mute:#56616C; --line:#D2D8DE; --field:#F1F3F5;
  --accent:#D94E00; --on-accent:#FFFFFF; --accent-soft:#FBE3D6;
  --ok:#17804A; --on-ok:#FFFFFF; --ok-soft:#DDF1E5;
  --shadow:0 1px 2px rgba(18,22,27,.10);
  --display:'Big Shoulders Display','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1317; --card:#181D23; --ink:#F2F4F6; --mute:#9AA6B2; --line:#28313A; --field:#0F1317;
    --accent:#FF7A2E; --on-accent:#1A0C02; --accent-soft:#3A2111;
    --ok:#4CCB87; --on-ok:#04210F; --ok-soft:#14301F;
    --shadow:0 1px 2px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1317; --card:#181D23; --ink:#F2F4F6; --mute:#9AA6B2; --line:#28313A; --field:#0F1317;
  --accent:#FF7A2E; --on-accent:#1A0C02; --accent-soft:#3A2111;
  --ok:#4CCB87; --on-ok:#04210F; --ok-soft:#14301F;
  --shadow:0 1px 2px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-block:12px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
body.has-timer{padding-bottom:178px;--barh:124px}
.fm #tabs,.fm #banner,.fm .eyebrow{display:none}
.fm h1{font-size:38px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.col{display:flex;flex-direction:column;gap:14px}

/* top switch */
.topbar{display:flex;gap:10px;align-items:center}
.segctl{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.segctl button{height:42px;border:0;border-radius:9px;background:none;font-weight:700;font-size:15px}
.segctl button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.icon-btn{width:52px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}

/* header */
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
h1{margin:0;font-family:var(--display);font-weight:900;font-size:56px;line-height:.92;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.prog-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;color:var(--mute);font-weight:600;margin-bottom:8px;font-variant-numeric:tabular-nums}
.prog-line b{font-family:var(--display);font-size:26px;color:var(--ink);font-weight:800;letter-spacing:.02em}
.segs{display:flex;gap:3px}
.seg{flex:1;height:8px;border-radius:2px;background:var(--line);min-width:2px}
.seg.on{background:var(--ok)}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px}
.tab{height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:16px;position:relative}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab.today::after{content:"";position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.banner{margin:0;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-weight:600;font-size:15px}
.modebar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.modebar .segctl{flex:none;width:200px}
.modebar span{font-size:13px;color:var(--mute);font-weight:600}

/* list view */
#list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:6px 14px 14px;border:2px solid transparent}
.card.current{border-color:var(--accent)}
.card.done{background:transparent;box-shadow:none;border:2px solid var(--line);padding-bottom:6px}
.head{width:100%;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 0 8px;background:none;border:0;text-align:left}
.name{font-weight:700;font-size:19px;line-height:1.2;min-width:0;overflow-wrap:anywhere;text-wrap:balance}
.state{flex:none;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.03em;color:var(--mute);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;min-height:26px}
.card.current .state{color:var(--accent)}
.card.done .state{color:var(--ok)}
.card.done .name{color:var(--mute)}
.sum{display:none;margin:0 0 8px;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.card.done:not(.open) .sum{display:block}
.card.done:not(.open) .body{display:none}
.body{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--field);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.rest{background:var(--accent-soft);border-color:transparent}
.hint{margin:0;font-size:14px;color:var(--mute)}
.last{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.last span{min-width:0}
.prog-tip{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:14px;font-weight:600}
.prog-tip span{min-width:0}
.link{min-height:44px;padding:0 12px;border-radius:10px;border:2px solid var(--line);background:none;font-weight:700;font-size:13px;flex:none}
.prog-tip .link{border-color:var(--accent);color:var(--accent)}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;transition:opacity .2s}
.num{position:relative;width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px;color:var(--ink);padding:0}
.set.next .num{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.set.done .num{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.set.done .field{opacity:.55}
.pb{position:absolute;top:-6px;right:-10px;padding:1px 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-family:var(--body);font-size:10px;font-weight:800;letter-spacing:.04em}
.field{position:relative;display:block}
.field input{width:100%;height:56px;border-radius:12px;border:2px solid var(--line);background:var(--field);color:var(--ink);font-family:var(--display);font-weight:800;font-size:28px;text-align:center;padding:0 40px 0 8px;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.field input::placeholder{color:var(--mute);opacity:.6;font-weight:700}
.field input:focus{border-color:var(--accent);outline:none;background:var(--card)}
.unit{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:var(--mute);pointer-events:none}

/* focus view */
.focus{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--accent)}
.fnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fnav .pos{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;text-align:center}
.fnav .pos small{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.fnav .pos b{white-space:nowrap;font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.03em;text-transform:uppercase;color:var(--accent);line-height:1}
.fnav button{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:none;display:grid;place-items:center}
.fnav button:disabled{opacity:.35}
.focus h2{margin:0;font-size:24px;line-height:1.15;font-weight:800;text-wrap:balance;overflow-wrap:anywhere}
.setline{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.03em;text-transform:uppercase;color:var(--accent);line-height:1}
.stepper{display:grid;grid-template-columns:68px minmax(0,1fr) 68px;gap:10px;align-items:center}
.stepper button{height:68px;border-radius:16px;border:2px solid var(--line);background:var(--field);font-family:var(--display);font-weight:800;font-size:40px;line-height:1;display:grid;place-items:center;padding:0;touch-action:manipulation;user-select:none}
.stepper button:active{background:var(--accent-soft);border-color:var(--accent)}
.bigval{position:relative;display:block}
.bigval input{width:100%;height:68px;border-radius:16px;border:2px solid var(--line);background:var(--field);color:var(--ink);font-family:var(--display);font-weight:900;font-size:40px;text-align:center;padding:0 8px 16px;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.bigval input:focus{border-color:var(--accent);outline:none;background:var(--card)}
.bigval .cap{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);pointer-events:none}
.stepbar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;color:var(--mute)}
.stepbar .segctl{flex:none;width:190px}
.stepbar .segctl button{height:38px;font-size:14px}
.go{position:sticky;bottom:calc(var(--barh,0px) + 10px);z-index:5;box-shadow:0 0 0 6px var(--card);height:64px;border-radius:16px;border:0;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.04em;text-transform:uppercase}
.go:disabled{background:var(--line);color:var(--mute)}
.dots{display:flex;gap:8px;justify-content:center}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.flast{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.flast .row{display:flex;gap:8px;flex-wrap:wrap}
.fok{display:flex;flex-direction:column;gap:10px;font-weight:600}

/* finish */
.finish{background:var(--ok-soft);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.finish h2{margin:0;font-family:var(--display);font-size:34px;font-weight:900;text-transform:uppercase;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.prline{margin:0;font-weight:800;color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:48px;padding:0 16px;border-radius:12px;border:2px solid var(--ink);background:none;font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{border-color:var(--accent);color:var(--accent)}
.copybox{width:100%;min-height:120px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace;padding:8px}

/* history */
.hsec{display:flex;flex-direction:column;gap:10px}
.hsec h2{margin:0;font-family:var(--display);font-size:28px;font-weight:900;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.tile b{font-family:var(--display);font-size:34px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile span{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px}
.wd{background:var(--card);border-radius:12px;padding:10px 6px;text-align:center;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent;font-size:14px}
.wd small{font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.04em}
.wd.ok{border-color:var(--ok);color:var(--ok)}
.wd.part{border-color:var(--accent);color:var(--accent)}
.acc{background:var(--card);border-radius:14px;box-shadow:var(--shadow)}
.acc>button{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px;border:0;background:none;text-align:left;min-height:56px}
.acc .t{font-weight:700;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.acc .s{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.acc .r{grid-row:1 / span 2;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.acc .r b{font-family:var(--display);font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.accbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.mini{width:84px;height:28px}
.chart{width:100%;height:auto;display:block}
.ch-grid{stroke:var(--line);stroke-width:1;fill:none}
.ch-line{stroke:var(--accent);stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.ch-area{fill:var(--accent-soft);stroke:none}
.ch-dot{fill:var(--accent);stroke:var(--card);stroke-width:2}
.ch-end{fill:var(--accent);stroke:var(--card);stroke-width:3}
.ch-t{fill:var(--mute);font-family:var(--body);font-size:11px;font-weight:600}
.ch-v{fill:var(--ink);font-family:var(--body);font-size:13px;font-weight:800}
.sl-line{stroke:var(--accent);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.sl-end{fill:var(--accent);stroke:none}
.mtog{display:flex;flex-direction:column;gap:8px}
.mtog .segctl{width:100%}
.mtog .segctl button{height:38px;font-size:13px}
.srows{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px;font-variant-numeric:tabular-nums}
.srows li{display:flex;justify-content:space-between;gap:10px}
.srows li span:last-child{color:var(--mute);text-align:right;min-width:0;overflow-wrap:anywhere}
.rec{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;background:var(--card);border-radius:14px;box-shadow:var(--shadow)}
.rec .pb{position:static}
.rec div{min-width:0}
.rec .t{font-weight:700;overflow-wrap:anywhere}
.rec .s{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.empty{background:var(--card);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:6px}
.empty b{font-family:var(--display);font-size:28px;font-weight:900;text-transform:uppercase}
.empty p{margin:0;color:var(--mute)}

/* timer bar, always pinned */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--accent);box-shadow:0 -10px 28px rgba(0,0,0,.22);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.ring{position:relative;width:88px;height:88px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .trk{stroke:var(--line)}
.ring .prg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:276.46;stroke-dashoffset:0}
.time{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:30px;font-variant-numeric:tabular-nums;letter-spacing:0}
.tinfo{min-width:0;display:flex;flex-direction:column;gap:2px}
.tlabel{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.04em;text-transform:uppercase;line-height:1.05}
.tnext{font-size:14px;color:var(--mute);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tbtn{display:flex;flex-direction:column;gap:6px}
.tbtn button{height:44px;min-width:104px;padding:0 12px;border-radius:10px;border:2px solid var(--line);background:none;font-weight:700;font-size:14px}
.timer.idle{border-top-color:var(--line)}
.timer.idle .time{color:var(--mute)}
.timer.idle .tlabel{color:var(--mute)}
.timer.idle #tPlus{display:none}
.timer.idle #tSkip{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.timer.over{background:var(--ok);color:var(--on-ok);border-top-color:var(--ok);animation:pulse 1s ease-out 3}
.timer.over .tnext{color:inherit;opacity:.85}
.timer.over .ring .trk{stroke:rgba(255,255,255,.3)}
.timer.over .ring .prg{stroke:var(--on-ok)}
.timer.over .tbtn button{border-color:currentColor}
.timer.over #tPlus{display:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 28px transparent}}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);z-index:40;max-width:calc(100% - 32px);background:var(--accent);color:var(--on-accent);padding:12px 16px;border-radius:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3);text-align:center}
.toast b{font-family:var(--display);font-size:22px;letter-spacing:.04em;text-transform:uppercase;display:block;line-height:1.1}

/* settings sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.sheet h2{margin:0;font-family:var(--display);font-size:32px;font-weight:900;text-transform:uppercase}
.sheet h3{margin:0 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.sheet p{margin:0 0 8px;font-size:14px;color:var(--mute)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;font-weight:600}
.opt input{width:28px;height:28px;accent-color:var(--accent)}
.status{font-size:14px;font-weight:600}
.file{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){h1{font-size:46px}.ring{width:76px;height:76px}.time{font-size:25px}.tbtn button{min-width:92px}.stepper{grid-template-columns:60px minmax(0,1fr) 60px}.stepper button{height:62px}.bigval input{height:62px;font-size:36px}}
</style>


</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="segctl" role="group" aria-label="Ansicht">
      <button type="button" id="vTrain" aria-pressed="true">Training</button>

<script>
(()=>{

RIR 2–3", "h": "Mittlere Last; keine erzwungenen Wiederholungen."}, {"d": "Freitag", "n": "Rudermaschine mit Bruststütze", "s": 3, "r": "8–12", "p": 90, "i": "RIR 2", "h": "Rücken neutral halten."}, {"d": "Freitag", "n": "Butterfly / Pec Deck", "s": 2, "r": "10–15", "p": 60, "i": "RIR 2", "h": "Kontrollierte Bewegung."}, {"d": "Freitag", "n": "Bizepscurl-Maschine", "s": 3, "r": "8–12", "p": 60, "i": "RIR 1–2", "h": "Wenn alle Sätze 12 schaffen: kleine Gewichtsstufe hoch."}, {"d": "Freitag", "n": "Trizepsdrücken am Kabelzug", "s": 3, "r": "8–12", "p": 60, "i": "RIR 1–2", "h": "Ellbogen ruhig halten."}, {"d": "Freitag", "n": "Beinbeuger-Maschine", "s": 2, "r": "10–15", "p": 60, "i": "RIR 2–3", "h": "Langsam und kontrolliert."}, {"d": "Sonntag", "n": "Hack Squat oder Pendulum Squat Maschine", "s": 3, "r": "8–12", "p": 120, "i": "RIR 3", "h": "Mit leichtem Gewicht starten; Sitz/Schulterpolster einstellen, schmerzfreier Bewegungsumfang. Wenn unangenehm: Beinpresse."}, {"d": "Sonntag", "n": "Bizepscurl-Maschine", "s": 3, "r": "10–15", "p": 60, "i": "RIR 1–2", "h": "Arme priorisieren; saubere Wiederholungen."}, {"d": "Sonntag", "n": "Trizepsdrücken am Kabelzug", "s": 3, "r": "10–15", "p": 60, "i": "RIR 1–2", "h": "Kein Schwung."}, {"d": "Sonntag", "n": "Bizepscurl (Hammer) am Kabelzug", "s": 2, "r": "12–15", "p": 60, "i": "RIR 1–2", "h": "Gleichmäßige Spannung."}, {"d": "Sonntag", "n": "Trizepsstrecken am Kabel oder Trizepsmaschine", "s": 2, "r": "12–15", "p": 60, "i": "RIR 1–2", "h": "Schmerzfreie Variante wählen."}, {"d": "Sonntag", "n": "Wadenheben sitzend oder stehend an der Maschine", "s": 3, "r": "10–15", "p": 60, "i": "RIR 2", "h": "Volle, kontrollierte Bewegung."}, {"d": "Sonntag", "n": "Reverse Wrist Curls", "s": 2, "r": "12–20", "p": 60, "i": "RIR 1–2", "h": "Unterarme abgestützt, Handflächen nach unten."}];
const WEEK = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const JS_DAY = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const CHECK = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHEV = d => '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="'+d+'" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
  keys(){ try { return Object.keys(localStorage); } catch(e){ return []; } }
};
const parse = j => { try { return j ? JSON.parse(j) : null; } catch(e){ return null; } };
const pad = n => String(n).padStart(2,'0');
const isoDate = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const deDate = iso => iso.split('-').reverse().join('.');
const shortDate = iso => iso.split('-').reverse().slice(0,2).join('.');
const fmt = s => Math.floor(s/60)+':'+pad(s%60);
const num = v => { const n = parseFloat(String(v).replace(',','.')); return isNaN(n) ? NaN : n; };
const fmtKg = n => { n = Math.round(n*100)/100; return (n % 1 ? String(n) : String(n)).replace('.',','); };
const e1rm = (kg,reps) => num(kg) * (1 + num(reps)/30);
const upper = r => { const m = String(r).match(/(\d+)\s*$/); return m ? parseInt(m[1],10) : 0; };
const lower = r => { const m = String(r).match(/^\s*(\d+)/); return m ? parseInt(m[1],10) : 0; };

/* ---------- state ---------- */
let plan = (() => { const p = parse(ls.get('tp.plan')); return p && p.rows && p.rows.length ? p : { rows: DEFAULT_PLAN, updated: 0 }; })();
let prefs = Object.assign({ sound:true, vibrate:true, mode:'list', step:2.5 }, parse(ls.get('tp.prefs')) || {});
const today = isoDate(new Date());
let day = null, sess = null, ui = [], hist = {}, bests = {}, nextTarget = null, interacted = false, T = null;
let view = 'train', focusEx = null, fv = null, fvKey = '', progCache = {};
const commitTimers = {};
const openEx = new Set(), openSess = new Set(), metric = {};
const savePrefs = () => ls.set('tp.prefs', JSON.stringify(prefs));

const dayList = () => {
  const seen = []; plan.rows.forEach(r => { if (!seen.includes(r.d)) seen.push(r.d); });
  return seen.sort((a,b) => { const x = WEEK.indexOf(a), y = WEEK.indexOf(b); return (x<0?99:x) - (y<0?99:y); });
};
const exercises = () => plan.rows.filter(r => r.d === day);
function pickDay(){
  const days = dayList(); const t = JS_DAY[new Date().getDay()];
  if (days.includes(t)) return { day:t, rest:false };
  const ti = WEEK.indexOf(t);
  for (let k = 1; k <= 7; k++){ const n = WEEK[(ti+k)%7]; if (days.includes(n)) return { day:n, rest:true }; }
  return { day:days[0], rest:false };
}
const sessKey = (d,dy) => 'tp.s.'+d+'_'+dy;
const loadSess = () => parse(ls.get(sessKey(today,day))) || { date:today, day, sets:{}, started:0, finished:0, updated:0 };
function getSet(name,i){ const a = sess.sets[name] || (sess.sets[name] = []); return a[i] || (a[i] = { kg:'', reps:'', d:false }); }
const valid = s => { const k = num(s.kg), r = num(s.reps); return !isNaN(k) && k >= 0 && !isNaN(r) && r > 0; };

let saveT = null;
function saveSess(){
  sess.updated = Date.now();
  ls.set(sessKey(sess.date,sess.day), JSON.stringify(sess));
  clearTimeout(saveT); saveT = setTimeout(pushRemote, 1500);
}
function allSessions(){
  const out = [];
  ls.keys().forEach(k => { if (k.startsWith('tp.s.')){ const s = parse(ls.get(k)); if (s && s.date && s.sets) out.push(s); } });
  out.sort((a,b) => a.date.localeCompare(b.date) || (a.updated||0) - (b.updated||0));
  return out;
}
const doneSets = (s,name) => (s.sets[name] || []).filter(x => x && x.d && valid(x));
function buildHistory(){
  const list = allSessions().filter(s => !(s.date === today && s.day === day)).reverse();
  hist = {}; bests = {}; progCache = {};
  list.forEach(s => { for (const n in s.sets){
    const ds = doneSets(s,n); if (!ds.length) continue;
    if (!hist[n]) hist[n] = ds;
    const b = bests[n] || (bests[n] = { kg:0, e1:0 });
    ds.forEach(x => { b.kg = Math.max(b.kg, num(x.kg)); b.e1 = Math.max(b.e1, e1rm(x.kg,x.reps)); });
  }});
}
/* progression: last time every set hit the top of the range */
function progression(e){
  if (e.n in progCache) return progCache[e.n];
  let res = null; const last = hist[e.n]; const up = upper(e.r);
  if (last && up && !/leicht/i.test(e.n) && last.length >= e.s && last.every(s => num(s.reps) >= up)){
    const top = Math.max(...last.map(s => num(s.kg)));
    if (top > 0){ const step = Math.max(2.5, Math.round(top*0.03/2.5)*2.5); res = { kg: top + step, from: top, reps: up }; }
  }
  return (progCache[e.n] = res);
}
function suggest(e,i){
  const last = hist[e.n]; const l = last ? last[Math.min(i,last.length-1)] : null;
  const prev = i > 0 ? getSet(e.n,i-1) : null; const pd = prev && prev.d;
  const prog = progression(e);
  const kg = pd ? prev.kg : prog ? fmtKg(prog.kg) : l ? String(l.kg) : '';
  const reps = pd ? prev.reps : prog ? String(lower(e.r) || '') : l ? String(l.reps) : String(lower(e.r) || '');
  return { kg, reps };
}

/* ---------- list render ---------- */
function renderTabs(){
  const nav = $('#tabs'); nav.textContent = '';
  const t = JS_DAY[new Date().getDay()];
  dayList().forEach(d => {
    const b = el('button','tab'+(d===t?' today':''), d.slice(0,2));
    b.type = 'button'; b.setAttribute('aria-pressed', String(d===day)); b.setAttribute('aria-label', d+(d===t?' (heute)':''));
    b.onclick = () => { if (d !== day){ day = d; focusEx = null; renderDay(); } };
    nav.append(b);
  });
}
function field(unit, mode){
  const l = el('label','field'); const i = el('input'); i.type = 'text'; i.inputMode = mode; i.autocomplete = 'off'; i.enterKeyHint = 'next';
  i.setAttribute('aria-label', unit === 'kg' ? 'Gewicht in Kilogramm' : 'Wiederholungen');
  l.append(i, el('span','unit',unit)); return { l, i };
}
function applySet(e,i,kg,reps){
  const s = getSet(e.n,i); s.kg = String(kg); s.reps = String(reps);
  const u = ui.find(x => x.e === e); if (u){ u.rows[i].kg.value = s.kg; u.rows[i].reps.value = s.reps; }
  interacted = true; if (!sess.started) sess.started = Date.now();
  commit(e,i);
}
function buildCard(e){
  const u = { e, rows:[] };
  const card = el('article','card'); u.card = card;
  const head = el('button','head'); head.type = 'button';
  u.state = el('span','state');
  head.append(el('span','name',e.n), u.state);
  head.onclick = () => { if (card.classList.contains('done')){ const o = card.classList.toggle('open'); head.setAttribute('aria-expanded', String(o)); } };
  u.sum = el('p','sum');
  const body = el('div','body');
  const chips = el('div','chips');
  chips.append(el('span','chip', e.s+' Sätze'), el('span','chip', e.r+' Wdh.'));
  if (e.i) chips.append(el('span','chip', e.i));
  chips.append(el('span','chip rest', e.p+' s Pause'));
  body.append(chips);
  if (e.h) body.append(el('p','hint', e.h));
  const last = hist[e.n]; const prog = progression(e);
  const fillKg = kgStr => { u.rows.forEach((r,i) => { const s = getSet(e.n,i); if (!s.d && s.kg === ''){ s.kg = kgStr; r.kg.value = kgStr; } }); interacted = true; saveSess(); refresh(); };
  if (prog){
    const tip = el('div','prog-tip');
    tip.append(el('span','', 'Alle Sätze bei '+prog.reps+' Wdh. geschafft. Heute '+fmtKg(prog.kg)+' kg probieren.'));
    const b = el('button','link', fmtKg(prog.kg)+' kg übernehmen'); b.type = 'button'; b.onclick = () => fillKg(fmtKg(prog.kg));
    tip.append(b); body.append(tip);
  } else if (last){
    const row = el('div','last');
    row.append(el('span','', 'Zuletzt: '+last.map(s => s.kg+'×'+s.reps).join(' · ')));
    const b = el('button','link','Gewicht übernehmen'); b.type = 'button';
    b.onclick = () => fillKg(String(last[0].kg));
    row.append(b); body.append(row);
  }
  const sets = el('div','sets');
  for (let i = 0; i < e.s; i++){
    const s = getSet(e.n,i);
    const row = el('div','set');
    const n = el('button','num', String(i+1)); n.type = 'button';
    const fk = field('kg','decimal'), fr = field('Wdh.','numeric');
    fk.i.value = s.kg; fr.i.value = s.reps;
    const r = { row, num:n, kg:fk.i, reps:fr.i };
    n.onclick = () => {
      const st = getSet(e.n,i);
      if (st.d){ fk.i.focus(); return; }
      const sg = suggest(e,i); const kg = st.kg !== '' ? st.kg : sg.kg; const reps = st.reps !== '' ? st.reps : sg.reps;
      unlockAudio();
      if (valid({ kg, reps })) applySet(e,i,kg,reps); else (kg === '' ? fk.i : fr.i).focus();
    };
    const onIn = (which, inp) => {
      inp.value = which === 'kg' ? inp.value.replace(/[^0-9.,]/g,'') : inp.value.replace(/\D/g,'');
      const st = getSet(e.n,i); st[which] = inp.value; interacted = true; sess.last = ui.findIndex(x => x.e === e);
      if (!sess.started) sess.started = Date.now();
      const key = e.n+'#'+i; clearTimeout(commitTimers[key]);
      commitTimers[key] = setTimeout(() => commit(e,i), 900);
      saveSess(); refreshPlaceholders();
    };
    fk.i.addEventListener('input', () => onIn('kg', fk.i));
    fr.i.addEventListener('input', () => onIn('reps', fr.i));
    [fk.i, fr.i].forEach(inp => {
      inp.addEventListener('focus', () => { unlockAudio(); setTimeout(() => { try { inp.select(); } catch(_){} }, 0); });
      inp.addEventListener('blur', () => commit(e,i));
    });
    fk.i.addEventListener('keydown', ev => { if (ev.key === 'Enter'){ ev.preventDefault(); fr.i.focus(); } });
    fr.i.addEventListener('keydown', ev => { if (ev.key === 'Enter'){ ev.preventDefault(); fr.i.blur(); } });
    row.append(n, fk.l, fr.l); sets.append(row); u.rows.push(r);
  }
  body.append(sets);
  card.append(head, u.sum, body);
  return u;
}
function renderDay(){
  sess = loadSess(); buildHistory();
  const ex = exercises();
  $('#dayName').textContent = day;
  const root = $('#list'); root.textContent = '';
  ui = ex.map(buildCard); ui.forEach(u => root.append(u.card));
  const segs = $('#segs'); segs.textContent = '';
  const total = ex.reduce((a,e) => a+e.s, 0);
  for (let i = 0; i < total; i++) segs.append(el('span','seg'));
  const t = JS_DAY[new Date().getDay()];
  $('#eyebrow').textContent = new Date().toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'long'});
  const b = $('#banner');
  if (day !== t){
    b.hidden = false;
    b.textContent = !dayList().includes(t) && pickDay().day === day ? 'Heute ist Ruhetag. Nächstes Training: '+day+'.' : 'Du siehst gerade den '+day+' (heute: '+t+').';
  } else b.hidden = true;

}
function refreshPlaceholders(){
  ui.forEach(u => u.rows.forEach((r,i) => {

    const pts = ss.map(s => { const ds = doneSets(s,n); if (!ds.length) return null; return { date:s.date, kg:Math.max(...ds.map(x => num(x.kg))), e1:Math.max(...ds.map(x => e1rm(x.kg,x.reps))), sets:ds }; }).filter(Boolean);
    if (!pts.length) return;
    const lastP = pts[pts.length-1], first = pts[0];
    const delta = lastP.kg - first.kg;
    const sub = pts.length > 1 ? (delta === 0 ? 'Gewicht gleich seit '+shortDate(first.date) : (delta > 0 ? '+' : '−')+fmtKg(Math.abs(delta))+' kg seit '+shortDate(first.date)) : '1 Einheit';
    const topSet = lastP.sets.slice().sort((a,b) => num(b.kg)-num(a.kg) || num(b.reps)-num(a.reps))[0];
    metric[n] = metric[n] || 'kg';
    exs.append(accordion(n, sub, fmtKg(lastP.kg)+' kg', topSet.reps+' Wdh.', openEx.has(n), o => { o ? openEx.add(n) : openEx.delete(n); }, body => {
      const drawn = el('div'); const draw = () => { drawn.textContent = ''; drawn.append(chart(pts, metric[n] === 'kg' ? 'kg' : 'e1', 'kg')); };
      const mt = el('div','mtog'); mt.append(el('span','s', metric[n] === 'kg' ? 'Top-Satz pro Einheit' : 'Geschätztes 1RM'));
      const sc = el('div','segctl'); sc.setAttribute('role','group');
      [['kg','Gewicht'],['e1','Geschätztes 1RM']].forEach(([k,l]) => { const b = el('button','',l); b.type = 'button'; b.setAttribute('aria-pressed', String(metric[n]===k)); b.onclick = () => { metric[n] = k; sc.querySelectorAll('button').forEach((x,j) => x.setAttribute('aria-pressed', String(['kg','e1'][j]===k))); mt.firstChild.textContent = k==='kg' ? 'Top-Satz pro Einheit' : 'Geschätztes 1RM'; draw(); }; sc.append(b); });
      mt.append(sc); draw();
      const ul = el('ul','srows');
      pts.slice().reverse().slice(0,8).forEach(p => { const li = el('li'); li.append(el('span','',shortDate(p.date)), el('span','',p.sets.map(x => x.kg+'×'+x.reps).join(' · '))); ul.append(li); });
      body.append(mt, drawn, ul);
    }, spark(pts)));
  });
  root.append(exs);

  const se = el('div','hsec'); se.append(el('h2','','Einheiten'));
  ss.slice().reverse().slice(0,10).forEach(s => {
    const id = s.date+'_'+s.day; let n = 0, vol = 0;
    for (const nm in s.sets) doneSets(s,nm).forEach(x => { n++; vol += num(x.kg)*num(x.reps); });
    se.append(accordion(s.day, deDate(s.date), n+' Sätze', Math.round(vol).toLocaleString('de-DE')+' kg', openSess.has(id), o => { o ? openSess.add(id) : openSess.delete(id); }, body => {
      const ul = el('ul','srows');
      for (const nm in s.sets){ const ds = doneSets(s,nm); if (!ds.length) continue; const li = el('li'); li.append(el('span','',nm), el('span','',ds.map(x => x.kg+'×'+x.reps).join(' · '))); ul.append(li); }
      body.append(ul);
    }));
  });
  root.append(se);
}

/* ---------- finish / copy ---------- */
function summaryText(){
  const lines = [day+', '+deDate(sess.date)];
  let vol = 0, n = 0;
  ui.forEach(u => {
    const ds = u.rows.map((r,i) => getSet(u.e.n,i)).filter(s => s.d);
    ds.forEach(s => { vol += num(s.kg)*num(s.reps); n++; });
    if (ds.length) lines.push(u.e.n+': '+ds.map(s => s.kg+' kg × '+s.reps+(s.pr?' (PB)':'')).join(', '));
  });
  lines.push('Sätze: '+n+' · Volumen: '+Math.round(vol).toLocaleString('de-DE')+' kg');
  return lines.join('\n');
}
function excelText(){
  return ui.map(u => {
    const cells = [deDate(sess.date), day, u.e.n, u.e.s, u.e.r];
    for (let i = 0; i < 4; i++){ const s = i < u.e.s ? getSet(u.e.n,i) : null; cells.push(s && s.d ? String(s.kg).replace('.',',') : '', s && s.d ? s.reps : ''); }
    return cells.join('\t');
  }).join('\n');
}
function copyText(text){
  const box = $('#copyBox');
  const fallback = () => { box.hidden = false; box.value = text; box.focus(); box.select(); };
  try { navigator.clipboard.writeText(text).then(() => { box.hidden = true; flash('Kopiert'); }, fallback); } catch(e){ fallback(); }
}
function flash(msg){ const b = $('#progSub'); const old = b.textContent; b.textContent = msg; setTimeout(() => { b.textContent = old; }, 1500); }
$('#copySum').onclick = () => copyText(summaryText());
$('#copyXls').onclick = () => copyText(excelText());

/* ---------- settings / import ---------- */
const sheet = $('#sheetScrim');
function openSheet(){
  $('#planInfo').textContent = plan.rows.length+' Übungen an '+dayList().length+' Tagen'+(plan.updated ? ' (importiert am '+new Date(plan.updated).toLocaleDateString('de-DE')+')' : ' (aus deiner Datei Trainingsplaner.xlsx)')+'.';
  $('#optSound').checked = prefs.sound; $('#optVib').checked = prefs.vibrate;
  $('#importStatus').textContent = '';
  $('#syncInfo').textContent = DB ? 'Deine Einträge werden mit deinem Konto gesichert und sind auf allen Geräten verfügbar.' : 'Deine Einträge bleiben auf diesem Gerät gespeichert.';
  $('#resetDay').textContent = 'Eingaben dieses Tages löschen'; $('#resetPlan').textContent = 'Original-Plan wiederherstellen';
  sheet.hidden = false; $('#closeSheet').focus();
}
const closeSheet = () => { sheet.hidden = true; };
$('#openSheet').onclick = openSheet; $('#closeSheet').onclick = closeSheet;
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });
$('#optSound').onchange = e => { prefs.sound = e.target.checked; savePrefs(); unlockAudio(); if (prefs.sound) alarm(); };
$('#optVib').onchange = e => { prefs.vibrate = e.target.checked; savePrefs(); if (prefs.vibrate){ try { navigator.vibrate && navigator.vibrate(200); } catch(_){} } };
function confirmTwice(btn, label, action){
  btn.onclick = () => {
    if (btn.dataset.armed){ delete btn.dataset.armed; action(); }
    else { btn.dataset.armed = '1'; btn.textContent = 'Wirklich? Nochmal tippen'; setTimeout(() => { delete btn.dataset.armed; btn.textContent = label; }, 4000); }
  };
}
confirmTwice($('#resetDay'), 'Eingaben dieses Tages löschen', () => {
  ls.del(sessKey(today,day)); stopTimer(); closeSheet(); renderDay(); saveRemoteDelete(); if (view === 'hist') renderHist();
});
confirmTwice($('#resetPlan'), 'Original-Plan wiederherstellen', () => {
  plan = { rows:DEFAULT_PLAN, updated:Date.now() }; savePlan(); closeSheet(); day = pickDay().day; renderDay();
});
function savePlan(){ ls.set('tp.plan', JSON.stringify(plan)); pushPlan(); }
function planFromSheet(wb){
  const name = wb.SheetNames.find(n => /trainingsplan/i.test(n)) || wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, defval:'' });
  if (!rows.length) throw new Error('Das Blatt ist leer.');
  const head = rows[0].map(h => String(h).toLowerCase());
  const col = re => head.findIndex(h => re.test(h));
  const c = { d:col(/^tag/), n:col(/übung|uebung/), s:col(/sätze|saetze/), r:col(/wdh/), p:col(/pause/), i:col(/intens/), h:col(/technik|hinweis/) };
  if (c.d < 0 || c.n < 0 || c.s < 0) throw new Error('Die Spalten Tag, Übung und Sätze fehlen.');
  const out = [];
  rows.slice(1).forEach(r => {
    const d = String(r[c.d]).trim(), n = String(r[c.n]).trim();
    if (!d || !n) return;
    out.push({ d, n, s:parseInt(r[c.s],10) || 3, r:c.r<0 ? '' : String(r[c.r]).replace(/\s*-\s*/g,'–'), p:c.p<0 ? 60 : (parseInt(r[c.p],10) || 60), i:c.i<0 ? '' : String(r[c.i]), h:c.h<0 ? '' : String(r[c.h]) });
  });
  if (!out.length) throw new Error('Keine Übungen gefunden.');
  return out;
}
$('#fileIn').onchange = async ev => {
  const f = ev.target.files[0]; const st = $('#importStatus'); if (!f) return;
  try {
    if (!window.XLSX) throw new Error('Der Excel-Import konnte nicht geladen werden. Prüfe die Verbindung.');
    const wb = XLSX.read(await f.arrayBuffer(), { type:'array' });
    plan = { rows:planFromSheet(wb), updated:Date.now() }; savePlan();
    day = pickDay().day; stopTimer(); renderDay();
    st.textContent = plan.rows.length+' Übungen an '+dayList().length+' Tagen geladen.';
  } catch(e){ st.textContent = 'Import fehlgeschlagen: '+(e.message || 'Datei nicht lesbar.'); }
  ev.target.value = '';
};

/* ---------- backup ---------- */
const backupJSON = () => { const o = {}; ls.keys().forEach(k => { if (k.startsWith('tp.') && k !== 'tp.timer') o[k] = ls.get(k); }); return JSON.stringify({ app:'trainingsplaner', v:1, data:o }); };
const inViewer = !!(window.claude && window.claude.use);
if (inViewer) $('#bkDl').hidden = true;
$('#bkCopy').onclick = () => {
  const txt = backupJSON(), box = $('#bkBox'), st = $('#bkStatus');
  const fb = () => { box.hidden = false; box.value = txt; box.focus(); box.select(); st.textContent = 'Text markieren und kopieren.'; };
  try { navigator.clipboard.writeText(txt).then(() => { st.textContent = 'Backup kopiert. Füge es in eine Notiz ein und bewahre es auf.'; }, fb); } catch(e){ fb(); }
};
$('#bkDl').onclick = () => {
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([backupJSON()], { type:'application/json' })); a.download = 'trainingsplaner-backup-'+today+'.json'; document.body.append(a); a.click(); a.remove(); $('#bkStatus').textContent = 'Backup heruntergeladen.'; }
  catch(e){ $('#bkStatus').textContent = 'Download nicht möglich. Nutze „Backup kopieren".'; }
};
$('#bkRestore').onclick = () => { $('#bkBox').hidden = false; $('#bkBox').value = ''; $('#bkGo').hidden = false; $('#bkBox').focus(); $('#bkStatus').textContent = 'Backup-Text einfügen und bestätigen.'; };
$('#bkGo').onclick = () => {
  const st = $('#bkStatus'); const o = parse($('#bkBox').value.trim());
  if (!o || o.app !== 'trainingsplaner' || !o.data){ st.textContent = 'Das ist kein gültiges Backup.'; return; }
  let n = 0; for (const k in o.data){ if (k.startsWith('tp.') && typeof o.data[k] === 'string'){ ls.set(k, o.data[k]); n++; } }
  plan = (() => { const p = parse(ls.get('tp.plan')); return p && p.rows && p.rows.length ? p : plan; })();
  prefs = Object.assign(prefs, parse(ls.get('tp.prefs')) || {});
  $('#bkBox').hidden = true; $('#bkGo').hidden = true; day = pickDay().day; stopTimer(); renderDay();
  st.textContent = 'Backup eingespielt ('+n+' Einträge).';
};

/* ---------- optional account sync (db) ---------- */
let DB = null, col = null;
function pushRemote(){
  if (!col || !sess) return;
  try { col.doc('s_'+sess.date+'_'+sess.day).set({ updated:sess.updated, json:JSON.stringify(sess) }).catch(() => {}); } catch(e){}
}
function pushPlan(){ if (!col) return; try { col.doc('plan').set({ updated:plan.updated, json:JSON.stringify(plan) }).catch(() => {}); } catch(e){} }
function saveRemoteDelete(){ if (!col) return; try { col.doc('s_'+today+'_'+day).delete().catch(() => {}); } catch(e){} }
async function initRemote(){
  try {
    if (!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    DB = db; col = db.collection('data/users/'+id);
    const snap = await col.get(); const remote = {};
    let planChanged = false;
    snap.docs.forEach(d => {
      const v = d.data() || {}; remote[d.id] = v.updated || 0;
      const o = parse(v.json); if (!o) return;
      if (d.id === 'plan'){
        if (o.rows && o.rows.length && (o.updated||0) > (plan.updated||0)){ plan = o; ls.set('tp.plan', JSON.stringify(o)); planChanged = true; }
      } else if (d.id.startsWith('s_')){
        const k = sessKey(o.date,o.day); const cur = parse(ls.get(k));
        if (!cur || (o.updated||0) > (cur.updated||0)) ls.set(k, v.json);
      }
    });
    ls.keys().forEach(k => {
      if (!k.startsWith('tp.s.')) return; const s = parse(ls.get(k)); if (!s) return;
      const rid = 's_'+s.date+'_'+s.day;
      if ((s.updated||0) > (remote[rid]||0)) col.doc(rid).set({ updated:s.updated, json:ls.get(k) }).catch(() => {});
    });
    if ((plan.updated||0) > (remote.plan||0) && plan.updated) pushPlan();
    if (planChanged){ day = pickDay().day; renderDay(); }
    else if (!interacted){ renderDay(); restoreTimer(); }
    else { buildHistory(); }
    if (view === 'hist') renderHist();
  } catch(e){}
}

/* ---------- start ---------- */
day = pickDay().day;
renderDay(); restoreTimer();
initRemote();
})();
